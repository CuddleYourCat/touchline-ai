name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled. Runs on main always finish, so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build, test and format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Touchline.slnx

      - name: Verify formatting
        run: dotnet format Touchline.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Touchline.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Touchline.slnx --configuration Release --no-build
          --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  validate-infra:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build and lint Bicep
        # Compiles without signing in to Azure. Linter warnings fail the job too,
        # so the template stays as clean as the C# (warnings as errors).
        run: |
          az bicep install
          output=$(az bicep build --file infra/main.bicep --stdout 2>&1 >/dev/null)
          echo "$output"
          if echo "$output" | grep -qiE "warning|error"; then exit 1; fi

      - name: Parse deploy script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/infra/deploy.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host "deploy.ps1 parses cleanly"
